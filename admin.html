<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Tour CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#C9A84C;--ivory:#F5EFE0;--parch:#EDE3C8;--terra:#B5541B;
  --ink:#0D1117;--card:#131920;--border:rgba(201,168,76,0.18);--err:#e84040;
  --serif:'Cormorant Garamond',Georgia,serif;--display:'Playfair Display',Georgia,serif;
}
html,body{height:100%;background:var(--ink);color:var(--ivory);font-family:var(--serif);}
button,input,select,textarea{font-family:var(--serif);box-sizing:border-box;}
button{cursor:pointer;}
.topbar{display:flex;align-items:center;gap:0.8rem;padding:0.8rem 1.2rem;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.brand{font-family:var(--display);font-size:1rem;color:var(--gold);flex:1;}
.main{display:flex;height:calc(100vh - 50px);}
.sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);background:var(--card);overflow-y:auto;display:flex;flex-direction:column;}
.content{flex:1;overflow-y:auto;padding:1.2rem;}
.sidebar-sec{padding:0.6rem 1rem;font-size:0.6rem;letter-spacing:0.4em;text-transform:uppercase;color:var(--gold);opacity:0.55;border-top:1px solid var(--border);}
.sidebar-sec:first-child{border-top:none;}
.day-item{display:flex;align-items:center;gap:0.5rem;padding:0.55rem 1rem;cursor:pointer;border-left:2px solid transparent;}
.day-item:hover{background:rgba(255,255,255,0.04);}
.day-item.active{background:rgba(201,168,76,0.07);border-left-color:var(--gold);}
.inp{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--ivory);font-family:var(--serif);font-size:0.93rem;padding:0.6rem 0.85rem;outline:none;}
.inp:focus{border-color:var(--gold);}
textarea.inp{resize:vertical;min-height:70px;line-height:1.6;}
select.inp option{background:#131920;}
.btn{display:inline-flex;align-items:center;gap:0.35rem;background:transparent;border:1px solid rgba(201,168,76,0.35);color:var(--parch);font-family:var(--serif);font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;padding:0.45rem 0.9rem;transition:all .2s;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600;}
.btn-gold:hover{background:#E8C97A;}
.btn-sm{font-size:0.68rem;padding:0.25rem 0.6rem;}
.btn-danger{border-color:rgba(232,64,64,0.3);color:rgba(232,64,64,0.65);}
.btn-danger:hover{border-color:var(--err);color:var(--err);}
.btn-icon{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.panel{background:var(--card);border:1px solid var(--border);padding:1.1rem;margin-bottom:0.9rem;}
.panel-title{font-family:var(--display);font-size:0.9rem;color:var(--gold);margin-bottom:0.9rem;padding-bottom:0.45rem;border-bottom:1px solid var(--border);}
.field{margin-bottom:0.75rem;}
.field label{display:block;font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);opacity:0.65;margin-bottom:0.3rem;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0.65rem;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.65rem;}
.stop-row{background:var(--card);border:1px solid var(--border);padding:0.75rem 0.85rem;margin-bottom:0.45rem;display:flex;align-items:center;gap:0.65rem;}
.stop-row.dragover{border-color:var(--gold);background:rgba(201,168,76,0.06);}
.drag-handle{cursor:grab;color:rgba(201,168,76,0.25);font-size:0.95rem;flex-shrink:0;}
.tab-bar{display:flex;border-bottom:1px solid var(--border);margin-bottom:1rem;}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--parch);font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;padding:0.6rem 1rem;cursor:pointer;opacity:0.6;}
.tab.active{border-bottom-color:var(--gold);color:var(--gold);opacity:1;}
.wizard{background:rgba(201,168,76,0.04);border:1px solid rgba(201,168,76,0.2);padding:1.1rem;margin-bottom:0.9rem;}
.spinner{width:17px;height:17px;border:2px solid rgba(201,168,76,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:1.2rem;right:1.2rem;background:var(--card);border:1px solid var(--border);padding:0.6rem 0.95rem;font-size:0.82rem;z-index:9999;opacity:0;transform:translateY(6px);transition:all .3s;pointer-events:none;max-width:300px;}
#toast.show{opacity:1;transform:translateY(0);}
#toast.ok{border-color:var(--gold);color:var(--gold);}
#toast.err{border-color:var(--err);color:var(--err);}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;}
.login-box{background:var(--card);border:1px solid var(--border);padding:2.2rem;width:320px;text-align:center;}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div style="font-family:var(--display);font-size:1.4rem;color:var(--gold);margin-bottom:0.25rem;">Tour CMS</div>
    <div style="font-style:italic;color:var(--parch);opacity:0.55;margin-bottom:1.3rem;font-size:0.85rem;">Panel de administración</div>
    <input type="password" class="inp" id="tok" placeholder="Contraseña" style="margin-bottom:0.65rem;" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="doLogin()" id="login-btn">Entrar</button>
    <div id="lerr" style="color:var(--err);font-size:0.78rem;margin-top:0.55rem;display:none;">Error al cargar</div>
  </div>
</div>

<div id="cms" style="display:none;flex-direction:column;height:100vh;">
  <div class="topbar">
    <div class="brand">Tour CMS · <span style="font-style:italic;font-size:0.85rem;color:var(--ivory);">Admin</span></div>
    <a href="/" class="btn btn-sm" onclick="window.open('/?t='+Date.now());return false;">← Ver guía</a>
    <button id="save-btn" class="btn btn-gold btn-sm" onclick="saveTour()" disabled>💾 Guardar</button>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-sec">Destino</div>
      <div style="padding:0.65rem 1rem;">
        <button class="btn btn-sm" style="width:100%;justify-content:center;" onclick="showMeta()">⚙ Configuración</button>
      </div>
      <div class="sidebar-sec">Días de ruta</div>
      <div id="days-list"></div>
      <div style="padding:0.65rem 1rem;">
        <button class="btn btn-sm" style="width:100%;justify-content:center;" onclick="addDay()">+ Añadir día</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fup" accept="image/jpeg,image/png,image/webp" style="display:none">

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
var TOKEN = '', tour = null, dayIdx = null, curDay = null, stopIdx = null, dirty = false;
var wikiPhotos = [], dragSrc = null, curTab = 'info';

var TYPES = [
  {id:'monument',   label:'Monumento',      icon:'🏛', color:'#C9A84C'},
  {id:'restaurant', label:'Restaurante',    icon:'🍽', color:'#E84040'},
  {id:'neighborhood',label:'Barrio/Zona',   icon:'🏘', color:'#7A9E9F'},
  {id:'museum',     label:'Museo',          icon:'🎨', color:'#6B7FA3'},
  {id:'viewpoint',  label:'Mirador',        icon:'🌿', color:'#5A8A5E'},
  {id:'market',     label:'Mercado',        icon:'🛍', color:'#8B5E3C'},
  {id:'other',      label:'Otro',           icon:'📍', color:'#9A8A7A'},
];

function tmeta(t){
  for(var i=0;i<TYPES.length;i++){if(TYPES[i].id===t)return TYPES[i];}
  return TYPES[TYPES.length-1];
}

function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function rd(id){var el=document.getElementById(id);return el?el.value:null;}

function allStops(){
  var result=[];
  var days=tour&&tour.days?tour.days:[];
  for(var i=0;i<days.length;i++){
    var stops=days[i].stops||[];
    for(var j=0;j<stops.length;j++) result.push(stops[j]);
  }
  return result;
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function doLogin(){
  TOKEN=document.getElementById('tok').value.trim();
  if(!TOKEN)return;
  document.getElementById('login-btn').textContent='Cargando…';
  document.getElementById('login-btn').disabled=true;
  fetch('/.netlify/functions/data?t='+Date.now())
    .then(function(r){return r.ok?r.json():Promise.reject(new Error('HTTP '+r.status));})
    .then(function(d){
      tour=d;
      if(!tour.meta)tour.meta={title:'Mi Tour',subtitle:'',description:'',heroImage:'',videoUrl:''};
      if(!tour.days)tour.days=[];
      document.getElementById('login').style.display='none';
      document.getElementById('cms').style.display='flex';
      renderSidebar();
      showMeta();
    })
    .catch(function(e){
      document.getElementById('lerr').textContent='Error: '+e.message;
      document.getElementById('lerr').style.display='block';
      document.getElementById('login-btn').textContent='Entrar';
      document.getElementById('login-btn').disabled=false;
    });
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function renderSidebar(){
  var html='';
  var days=tour.days||[];
  for(var i=0;i<days.length;i++){
    var d=days[i];
    var active=dayIdx===i;
    html+='<div class="day-item'+(active?' active':'')+'" onclick="selectDay('+i+')">'+
      '<div style="width:19px;height:19px;border-radius:50%;background:rgba(201,168,76,0.15);display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:var(--gold);flex-shrink:0;">'+(i+1)+'</div>'+
      '<div style="flex:1;font-size:0.8rem;color:var(--parch);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(d.title||'Día '+(i+1))+'</div>'+
      '<div style="font-size:0.62rem;color:var(--parch);opacity:0.4;">'+((d.stops||[]).length)+'</div>'+
    '</div>';
  }
  document.getElementById('days-list').innerHTML=html;
}

function selectDay(i){
  // Save open editor before switching
  if(stopIdx!==null) applyStopFields();
  dayIdx=i; curDay=tour.days[i]; stopIdx=null;
  renderSidebar(); showDay();
}

function addDay(){
  if(stopIdx!==null) applyStopFields();
  var n=(tour.days||[]).length+1;
  if(!tour.days) tour.days=[];
  tour.days.push({id:'day-'+Date.now(),title:'Día '+n,description:'',stops:[]});
  markDirty(); renderSidebar(); selectDay(tour.days.length-1);
}

// ── META ──────────────────────────────────────────────────────────────────────
function showMeta(){
  stopIdx=null; curDay=null; dayIdx=null; renderSidebar();
  var m=tour.meta||{};
  document.getElementById('content').innerHTML=
    '<div class="panel"><div class="panel-title">Información del destino</div>'+
    '<div class="field"><label>Nombre del destino</label><input class="inp" id="m-title" value="'+esc(m.title||'')+'"></div>'+
    '<div class="field"><label>Subtítulo</label><input class="inp" id="m-sub" value="'+esc(m.subtitle||'')+'"></div>'+
    '<div class="field"><label>Descripción</label><textarea class="inp" id="m-desc">'+esc(m.description||'')+'</textarea></div>'+
    '<div class="field"><label>URL imagen portada (hero)</label><input class="inp" id="m-hero" value="'+esc(m.heroImage||'')+'" placeholder="https://..."></div>'+
    '<div class="field"><label>📹 URL vídeo YouTube del destino</label><input class="inp" id="m-video" value="'+esc(m.videoUrl||'')+'" placeholder="https://www.youtube.com/watch?v=..."></div>'+
    '<button class="btn btn-gold btn-sm" onclick="applyMeta()">✓ Aplicar</button>'+
    '</div>';
}

function applyMeta(){
  if(!tour.meta) tour.meta={};
  tour.meta.title=rd('m-title')||tour.meta.title;
  tour.meta.subtitle=rd('m-sub')||'';
  tour.meta.description=rd('m-desc')||'';
  tour.meta.heroImage=rd('m-hero')||'';
  tour.meta.videoUrl=rd('m-video')||'';
  markDirty(); toast('✓ Configuración aplicada','ok');
}

// ── DAY EDITOR ────────────────────────────────────────────────────────────────
function showDay(){
  if(!curDay)return;
  var stopsHtml=renderStopRows();
  document.getElementById('content').innerHTML=
    '<div class="panel">'+
      '<div class="panel-title">'+esc(curDay.title||'Día')+'</div>'+
      '<div class="row2">'+
        '<div class="field"><label>Título del día</label><input class="inp" id="day-t" value="'+esc(curDay.title||'')+'"></div>'+
        '<div class="field"><label>Descripción</label><input class="inp" id="day-d" value="'+esc(curDay.description||'')+'"></div>'+
      '</div>'+
      '<div style="display:flex;gap:0.6rem;">'+
        '<button class="btn btn-sm" onclick="applyDayFields()">✓ Aplicar</button>'+
        '<button class="btn btn-sm btn-danger" onclick="deleteDay()">🗑 Eliminar día</button>'+
      '</div>'+
    '</div>'+

    '<div class="wizard">'+
      '<div style="font-family:var(--display);font-size:0.9rem;color:var(--gold);margin-bottom:0.8rem;">➕ Añadir atracción</div>'+
      '<div class="row2">'+
        '<div class="field"><label>Nombre</label><input class="inp" id="nn" placeholder="Ej: Medina Azahara"></div>'+
        '<div class="field"><label>Ciudad / Lugar</label><input class="inp" id="nl" value="'+esc((tour.meta&&tour.meta.title)||'')+'" placeholder="Córdoba, España"></div>'+
      '</div>'+
      '<div class="row2">'+
        '<div class="field"><label>Tipo</label><select class="inp" id="nt">'+
          TYPES.map(function(t){return'<option value="'+t.id+'">'+t.icon+' '+t.label+'</option>';}).join('')+
        '</select></div>'+
        '<div class="field"><label>Hora</label><input class="inp" id="ntm" placeholder="09:00"></div>'+
      '</div>'+
      '<div style="display:flex;gap:0.6rem;flex-wrap:wrap;">'+
        '<button class="btn btn-gold" onclick="genStop()">✨ Generar con IA</button>'+
        '<button class="btn" onclick="addManual()">+ Manual</button>'+
      '</div>'+
      '<div id="genbar" style="display:none;align-items:center;gap:0.6rem;padding:0.65rem;background:rgba(201,168,76,0.04);border:1px solid var(--border);margin-top:0.6rem;">'+
        '<div class="spinner"></div><div id="genmsg" style="font-size:0.83rem;color:var(--parch);opacity:0.7;font-style:italic;">Generando…</div>'+
      '</div>'+
    '</div>'+

    '<div class="panel">'+
      '<div class="panel-title">Paradas <span style="opacity:0.4;font-size:0.75rem;">· Arrastra para reordenar</span></div>'+
      '<div id="stops-list">'+stopsHtml+'</div>'+
    '</div>'+

    '<div id="stop-editor"></div>';

  initDrag();
}

function applyDayFields(){
  if(!curDay)return;
  var t=rd('day-t'), d=rd('day-d');
  if(t!==null)curDay.title=t;
  if(d!==null)curDay.description=d;
  markDirty(); renderSidebar(); toast('✓ Día actualizado','ok');
}

function deleteDay(){
  if(!confirm('¿Eliminar este día y sus paradas?'))return;
  tour.days.splice(dayIdx,1);
  dayIdx=null; curDay=null; stopIdx=null;
  markDirty(); renderSidebar();
  document.getElementById('content').innerHTML='<div style="padding:2rem;opacity:0.35;font-style:italic;">Selecciona un día</div>';
}

function renderStopRows(){
  if(!curDay||!(curDay.stops||[]).length)
    return '<div style="padding:1rem;text-align:center;opacity:0.35;font-style:italic;font-size:0.85rem;">Sin paradas. Usa el formulario de arriba.</div>';
  var html='';
  for(var i=0;i<curDay.stops.length;i++){
    var s=curDay.stops[i], tm=tmeta(s.type);
    html+='<div class="stop-row" draggable="true" data-idx="'+i+'">'+
      '<div class="drag-handle">⠿</div>'+
      '<div style="width:24px;height:24px;border-radius:'+(s.type==='restaurant'?'4px':'50%')+';background:'+tm.color+';display:flex;align-items:center;justify-content:center;font-size:'+(s.type==='restaurant'?'0.85rem':'0.68rem')+';color:#0D1117;font-weight:700;flex-shrink:0;">'+(s.type==='restaurant'?tm.icon:(i+1))+'</div>'+
      '<div style="flex:1;min-width:0;">'+
        '<div style="font-size:0.88rem;color:var(--ivory);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(s.name)+'</div>'+
        '<div style="font-size:0.68rem;color:var(--parch);opacity:0.5;">'+tm.icon+' '+tm.label+(s.time?' · '+s.time:'')+'</div>'+
      '</div>'+
      '<button class="btn btn-sm btn-icon" onclick="editStop('+i+')" style="flex-shrink:0;">✏️</button>'+
      '<button class="btn btn-sm btn-icon btn-danger" onclick="deleteStop('+i+')" style="flex-shrink:0;">🗑</button>'+
    '</div>';
  }
  return html;
}

// ── GENERATE WITH AI ──────────────────────────────────────────────────────────
async function genStop(){
  var name=(rd('nn')||'').trim();
  var loc=(rd('nl')||'').trim();
  var type=rd('nt')||'monument';
  var time=(rd('ntm')||'').trim();
  if(!name){toast('Escribe el nombre','err');return;}
  if(!loc){toast('Escribe la ciudad','err');return;}
  var bar=document.getElementById('genbar');
  bar.style.display='flex';
  document.getElementById('genmsg').textContent='🤖 Claude generando…';
  try{
    var r=await fetch('/.netlify/functions/generate',{method:'POST',
      headers:{'Content-Type':'application/json','x-admin-token':TOKEN},
      body:JSON.stringify({name:name,location:loc,type:type,city:tour.meta&&tour.meta.title})});
    var d=await r.json();
    if(!r.ok||d.error) throw new Error(d.error||'Error generando');
    var stop=d.stop;
    stop.time=time||stop.suggestedTime||'';
    stop.duration=stop.suggestedDuration||'60 min';
    stop.photos=[];
    stop.audioSections=stop.audioSections||[];
    stop.videoUrl=''; stop.website=''; stop.bookingUrl='';
    stop.phone=''; stop.priceRange=''; stop.address='';
    document.getElementById('genmsg').textContent='🖼 Buscando fotos…';
    try{
      var wr=await fetch('/.netlify/functions/wikimedia?query='+encodeURIComponent(name+' '+loc));
      var wd=await wr.json();
      if(wd.ok&&wd.photos&&wd.photos.length) stop.photos=wd.photos.slice(0,3).map(function(p){return p.url;});
    }catch(e){}
    if(!curDay.stops) curDay.stops=[];
    curDay.stops.push(stop);
    markDirty();
    bar.style.display='none';
    document.getElementById('nn').value='';
    document.getElementById('ntm').value='';
    showDay();
    setTimeout(function(){editStop(curDay.stops.length-1);},80);
    toast('✓ "'+name+'" añadida con IA','ok');
  }catch(e){
    bar.style.display='none';
    toast('Error: '+e.message,'err');
  }
}

function addManual(){
  var name=(rd('nn')||'Nueva parada').trim();
  var loc=(rd('nl')||'').trim();
  var type=rd('nt')||'monument';
  var time=(rd('ntm')||'').trim();
  var tm=tmeta(type);
  var stop={id:'stop-'+Date.now(),name:name,location:loc,type:type,time:time,
    duration:'60 min',color:tm.color,subtitle:'',description:'',history:'',
    audioSections:[],videoUrl:'',facts:[],tips:[],photos:[],dishes:null,
    website:'',bookingUrl:'',phone:'',priceRange:'',address:'',
    order:(curDay.stops||[]).length+1};
  if(!curDay.stops) curDay.stops=[];
  curDay.stops.push(stop);
  markDirty(); showDay();
  setTimeout(function(){editStop(curDay.stops.length-1);},80);
}

// ── STOP EDITOR ───────────────────────────────────────────────────────────────
function editStop(i){
  stopIdx=i;
  var s=curDay.stops[i];
  var tm=tmeta(s.type);
  var isRest=s.type==='restaurant';
  curTab='info';

  var photosHtml='';
  var photos=s.photos||[];
  for(var pi=0;pi<photos.length;pi++){
    photosHtml+='<div style="position:relative;width:88px;height:66px;overflow:hidden;border:1px solid rgba(201,168,76,0.3);">'+
      '<img src="'+esc(photos[pi])+'" style="width:100%;height:100%;object-fit:cover;">'+
      '<button onclick="removePhoto('+pi+')" style="position:absolute;top:2px;right:2px;background:rgba(232,64,64,0.85);border:none;color:white;width:15px;height:15px;cursor:pointer;font-size:0.55rem;border-radius:2px;line-height:1;">✕</button>'+
    '</div>';
  }

  var secHtml='';
  var secs=s.audioSections||[];
  for(var si=0;si<secs.length;si++){
    var sec=secs[si];
    var hasMap=sec.mapImage&&sec.mapImage.length>0;
    secHtml+='<div style="background:rgba(255,255,255,0.03);border:1px solid var(--border);padding:0.9rem;margin-bottom:0.6rem;">'+
      '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.6rem;">'+
        '<div style="width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;flex-shrink:0;">'+(si+1)+'</div>'+
        '<div style="flex:1;font-size:0.85rem;color:var(--ivory);">'+esc(sec.title||'Sección '+(si+1))+'</div>'+

function switchTab(t){
  curTab=t;
  var tabs=['info','audio','rest','media'];
  for(var i=0;i<tabs.length;i++){
    var btn=document.getElementById('tab-'+tabs[i]);
    var cont=document.getElementById('tc-'+tabs[i]);
    if(btn) btn.classList.toggle('active',tabs[i]===t);
    if(cont) cont.style.display=tabs[i]===t?'block':'none';
  }
}

function closeEditor(){stopIdx=null;document.getElementById('stop-editor').innerHTML='';}

// ── APPLY STOP FIELDS (reads ALL inputs regardless of tab visibility) ─────────
function applyStopFields(){
  if(stopIdx===null||!curDay||!curDay.stops[stopIdx])return;
  var s=curDay.stops[stopIdx];

  // Basic fields - always in DOM when editor is open
  var v=rd('se-name');   if(v!==null&&v!=='') s.name=v;
  var v=rd('se-sub');    if(v!==null) s.subtitle=v;
  var v=rd('se-type');   if(v!==null&&v!=='') s.type=v;
  var v=rd('se-time');   if(v!==null) s.time=v;
  var v=rd('se-dur');    if(v!==null) s.duration=v;
  var v=rd('se-addr');   if(v!==null) s.address=v;
  var v=rd('se-desc');   if(v!==null) s.description=v;
  var v=rd('se-hist');   if(v!==null) s.history=v;
  var v=rd('se-web');    if(v!==null) s.website=v;
  var v=rd('se-video');  if(v!==null) s.videoUrl=v;
  var v=rd('se-phone');  if(v!==null) s.phone=v;
  var v=rd('se-price');  if(v!==null) s.priceRange=v;
  var v=rd('se-book');   if(v!==null) s.bookingUrl=v;

  var tipsEl=document.getElementById('se-tips');
  if(tipsEl) s.tips=tipsEl.value.split('\n').map(function(t){return t.trim();}).filter(Boolean);

  var lat=parseFloat(rd('se-lat'));
  var lng=parseFloat(rd('se-lng'));
  if(!isNaN(lat)) s.lat=lat;
  if(!isNaN(lng)) s.lng=lng;

  s.color=(tmeta(s.type)||{color:s.color}).color;

  // Facts
  var facts=[];
  for(var fi=0;fi<3;fi++){
    var fv=rd('fv'+fi)||'', fl=rd('fl'+fi)||'';
    if(fv||fl) facts.push({value:fv,label:fl});
  }
  s.facts=facts;

  // Audio sections
  var secs=s.audioSections||[];
  for(var si=0;si<secs.length;si++){
    var t=rd('sec-t-'+si); if(t!==null) secs[si].title=t;
    var x=rd('sec-x-'+si); if(x!==null) secs[si].text=x;
    var m=rd('sec-m-'+si); if(m!==null) secs[si].mapImage=m;
  }
  s.audioSections=secs;

  // Dishes
  var dishes=s.dishes||[];
  for(var di=0;di<dishes.length;di++){
    var dn=rd('dn-'+di); if(dn!==null) dishes[di].name=dn;
    var dd=rd('dd-'+di); if(dd!==null) dishes[di].description=dd;
  }
  if(dishes.length>0) s.dishes=dishes;

  markDirty();
  document.getElementById('stops-list').innerHTML=renderStopRows();
  initDrag();
  toast('✓ '+s.name+' — fotos:'+((s.photos||[]).length)+(s.videoUrl?' + vídeo':''),'ok');
}

function deleteStop(i){
  if(!confirm('¿Eliminar esta parada?'))return;
  curDay.stops.splice(i,1);
  markDirty(); closeEditor();
  document.getElementById('stops-list').innerHTML=renderStopRows();
  initDrag();
}

// ── SECTIONS ──────────────────────────────────────────────────────────────────
function addSection(){
  if(stopIdx===null)return;
  applyStopFields(); // save current state first
  var s=curDay.stops[stopIdx];
  if(!s.audioSections) s.audioSections=[];
  s.audioSections.push({id:'as-'+Date.now(),title:'Sección '+(s.audioSections.length+1),text:'',mapImage:''});
  editStop(stopIdx); switchTab('audio');
}

function delSection(si){
  if(stopIdx===null)return;
  applyStopFields();
  curDay.stops[stopIdx].audioSections.splice(si,1);
  editStop(stopIdx); switchTab('audio');
}

function uploadSectionImg(si){
  if(stopIdx===null)return;
  document.getElementById('fup').onchange=function(e){
    var file=e.target.files[0];
    if(!file)return;
    if(file.size>5*1024*1024){toast('Imagen demasiado grande (máx 5MB)','err');return;}
    var r=new FileReader();
    r.onload=function(ev){
      var parts=ev.target.result.split(',');
      var mime=parts[0].replace('data:','').replace(';base64','');
      var b64=parts[1];
      var key='sec-'+Date.now();
      toast('Subiendo imagen…','ok');
      fetch('/.netlify/functions/upload',{method:'POST',
        headers:{'Content-Type':'application/json','x-admin-token':TOKEN},
        body:JSON.stringify({key:key,data:b64,mime:mime})})
        .then(function(r){return r.json();})
        .then(function(d){
          if(d.error){toast('Error: '+d.error,'err');return;}
          var url=d.repo?'https://raw.githubusercontent.com/'+d.repo+'/main/'+d.path:ev.target.result;
          applyStopFields();
          curDay.stops[stopIdx].audioSections[si].mapImage=url;
          markDirty();
          editStop(stopIdx); switchTab('audio');
          toast('✓ Imagen subida','ok');
        })
        .catch(function(e){toast('Error: '+e.message,'err');});
    };
    r.readAsDataURL(file);
  };
  document.getElementById('fup').click();
}

function clearSectionImg(si){
  if(stopIdx===null)return;
  applyStopFields();
  curDay.stops[stopIdx].audioSections[si].mapImage='';
  markDirty(); editStop(stopIdx); switchTab('audio');
}

// ── DISHES ────────────────────────────────────────────────────────────────────
function addDish(){
  if(stopIdx===null)return;
  applyStopFields();
  var s=curDay.stops[stopIdx];
  if(!s.dishes) s.dishes=[];
  s.dishes.push({name:'',description:''});

function delDish(di){
  if(stopIdx===null)return;
  applyStopFields();
  curDay.stops[stopIdx].dishes.splice(di,1);

}

        headers:{'Content-Type':'application/json','x-admin-token':TOKEN},
        body:JSON.stringify({key:key,data:b64,mime:mime})})
        .then(function(r){return r.json();})
        .then(function(d){
          if(d.error){toast('Error: '+d.error,'err');return;}

async function searchWiki(){
  if(stopIdx===null)return;
  var s=curDay.stops[stopIdx];
  var q=s.name+' '+(s.location||(tour.meta&&tour.meta.title)||'');
  var g=document.getElementById('wiki-grid');
  g.innerHTML='<div style="font-style:italic;opacity:0.45;font-size:0.82rem;">Buscando…</div>';
  try{
    var r=await fetch('/.netlify/functions/wikimedia?query='+encodeURIComponent(q));
    var d=await r.json();
    if(!d.ok||!d.photos||!d.photos.length){g.innerHTML='<div style="opacity:0.45;font-size:0.82rem;">Sin resultados</div>';return;}
    wikiPhotos=d.photos;
    renderWikiGrid(s.photos||[]);
  }catch(e){g.innerHTML='<div style="color:var(--err);font-size:0.82rem;">Error: '+e.message+'</div>';}
}

function renderWikiGrid(cur){
  var g=document.getElementById('wiki-grid');if(!g)return;
  var html='<div style="font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);opacity:0.55;margin-bottom:0.45rem;">Pulsa para añadir/quitar</div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:0.4rem;">';
  for(var i=0;i<wikiPhotos.length;i++){
    var p=wikiPhotos[i];
    var sel=cur.indexOf(p.url)>=0;
    html+='<div onclick="toggleWiki('+i+')" style="position:relative;aspect-ratio:4/3;overflow:hidden;cursor:pointer;border:2px solid '+(sel?'var(--gold)':'transparent')+';transition:all .2s;">'+
      '<img src="'+esc(p.url)+'" style="width:100%;height:100%;object-fit:cover;" loading="lazy">'+
      (sel?'<div style="position:absolute;top:2px;right:2px;width:15px;height:15px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:0.58rem;font-weight:700;display:flex;align-items:center;justify-content:center;">✓</div>':'')+
    '</div>';
  }
  html+='</div>';
  g.innerHTML=html;
}

function toggleWiki(wi){
  if(stopIdx===null)return;
  var s=curDay.stops[stopIdx];
  if(!s.photos) s.photos=[];
  var url=wikiPhotos[wi].url;
  var pos=s.photos.indexOf(url);
  if(pos>=0) s.photos.splice(pos,1);
  else s.photos.push(url);
  markDirty(); renderWikiGrid(s.photos);
}

// ── DRAG & DROP ───────────────────────────────────────────────────────────────
function initDrag(){
  var rows=document.querySelectorAll('.stop-row');
  for(var i=0;i<rows.length;i++){
    rows[i].addEventListener('dragstart',function(e){dragSrc=parseInt(this.dataset.idx);e.dataTransfer.effectAllowed='move';});
    rows[i].addEventListener('dragend',function(){
      var all=document.querySelectorAll('.stop-row');
      for(var j=0;j<all.length;j++) all[j].classList.remove('dragover');
    });
    rows[i].addEventListener('dragover',function(e){e.preventDefault();this.classList.add('dragover');});
    rows[i].addEventListener('dragleave',function(){this.classList.remove('dragover');});
    rows[i].addEventListener('drop',function(e){
      e.preventDefault();this.classList.remove('dragover');
      var di=parseInt(this.dataset.idx);
      if(dragSrc===null||dragSrc===di)return;
      var moved=curDay.stops.splice(dragSrc,1)[0];
      curDay.stops.splice(di,0,moved);
      markDirty();
      document.getElementById('stops-list').innerHTML=renderStopRows();
      initDrag();
    });
  }
}

// ── SAVE ─────────────────────────────────────────────────────────────────────
async function saveTour(){
  // 1. Apply meta if visible
  var mTitle=document.getElementById('m-title');
  if(mTitle) applyMeta();

  // 2. Apply open stop editor
  if(stopIdx!==null) applyStopFields();

  // 3. Apply open day fields
  var dayT=document.getElementById('day-t');
  if(dayT) applyDayFields();

  var btn=document.getElementById('save-btn');
  btn.disabled=true;
  btn.textContent='⏳ Guardando…';
  btn.style.background='';
  btn.style.borderColor='';

  try{
    tour.meta.updatedAt=new Date().toISOString();
    var r=await fetch('/.netlify/functions/save',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-admin-token':TOKEN},
      body:JSON.stringify({tourData:tour})
    });
    var d=await r.json();
    if(d.error) throw new Error(d.error);
    dirty=false;
    btn.textContent='✓ Guardado';
    setTimeout(function(){
      btn.textContent='💾 Guardar';
      btn.disabled=true;
    },2000);
    toast('✓ Guardado en GitHub','ok');
  }catch(e){
    btn.textContent='💾 Guardar';
    btn.disabled=false;
    toast('Error guardando: '+e.message,'err');
  }
}

function markDirty(){
  dirty=true;
  var btn=document.getElementById('save-btn');
  btn.disabled=false;
  btn.textContent='💾 Guardar';
  btn.style.background='#c0392b';
  btn.style.borderColor='#c0392b';
}

var toastTimer;
function toast(msg,type){
  var el=document.getElementById('toast');
  el.textContent=msg;el.className='show '+(type||'ok');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.className='';},3500);
}

window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});
</script>
