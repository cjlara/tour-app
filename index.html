<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour Guiado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--ivory:#F5EFE0;--parch:#EDE3C8;
  --terra:#B5541B;--ink:#0D1117;--card:#131920;--smoke:#1E2535;
  --border:rgba(201,168,76,0.18);
  --serif:'Cormorant Garamond',Georgia,serif;
  --display:'Playfair Display',Georgia,serif;
}
html{scroll-behavior:smooth;}
body{background:var(--ink);color:var(--ivory);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font-family:var(--serif);cursor:pointer;}
/* Leaflet dark */
.leaflet-container{background:#0e1420;}
.leaflet-popup-content-wrapper{background:rgba(14,20,32,0.97);border:1px solid var(--border);border-radius:0;color:var(--ivory);}
.leaflet-popup-tip{background:rgba(14,20,32,0.97);}
.leaflet-popup-content{margin:10px 14px;font-family:var(--serif);}
/* Waveform */
.wbar{display:inline-block;width:2px;height:3px;background:currentColor;border-radius:1px;margin:0 1px;transition:height .1s;}
.wbar.on{animation:wv .7s ease-in-out infinite;}
.wbar.on:nth-child(2){animation-delay:.1s}.wbar.on:nth-child(3){animation-delay:.2s}
.wbar.on:nth-child(4){animation-delay:.15s}.wbar.on:nth-child(5){animation-delay:.05s}
.wbar.on:nth-child(6){animation-delay:.22s}.wbar.on:nth-child(7){animation-delay:.1s}
.wbar.on:nth-child(8){animation-delay:.18s}
@keyframes wv{0%,100%{height:3px}50%{height:14px}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const GITHUB_REPO = (window.GITHUB_REPO) || "";
const RAW_BASE = "https://raw.githubusercontent.com/" + (GITHUB_REPO || "cjlara/cordoba-tour") + "/main";

const C = {
  gold:"#C9A84C", gold2:"#E8C97A", ivory:"#F5EFE0", parch:"#EDE3C8",
  terra:"#B5541B", ink:"#0D1117", card:"#131920", border:"rgba(201,168,76,0.18)",
};

const TYPE_COLORS = {
  monument:"#C9A84C", restaurant:"#B5541B", neighborhood:"#7A9E9F",
  museum:"#6B7FA3", viewpoint:"#5A8A5E", market:"#8B5E3C", other:"#9A8A7A"
};

// ── AUDIO ENGINE ──────────────────────────────────────────────────────────────
const synth = window.speechSynthesis;
let globalUtter = null, globalBtn = null;

function getBestVoice() {
  const voices = synth.getVoices();
  return voices.find(v => v.lang === 'es-ES' && /google/i.test(v.name))
    || voices.find(v => v.lang.startsWith('es-ES'))
    || voices.find(v => v.lang.startsWith('es'))
    || null;
}

function stopAll() {
  synth.cancel();
  if (globalBtn) { globalBtn.setPlaying(false); globalBtn = null; }
}

function readText(text, btnController) {
  stopAll();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'es-ES'; utter.rate = 0.88; utter.pitch = 1.0;
  const v = getBestVoice(); if (v) utter.voice = v;
  utter.onstart  = () => { btnController.setPlaying(true); globalBtn = btnController; };
  utter.onend    = utter.onerror = () => { btnController.setPlaying(false); if (globalBtn === btnController) globalBtn = null; };
  utter.onpause  = () => btnController.setPlaying(false);
  utter.onresume = () => btnController.setPlaying(true);
  globalUtter = utter;
  synth.speak(utter);
}

function toggleRead(text, btnController) {
  if (globalBtn === btnController && synth.speaking) {
    if (synth.paused) { synth.resume(); btnController.setPlaying(true); }
    else { synth.pause(); btnController.setPlaying(false); }
    return;
  }
  readText(text, btnController);
}

// ── READ BUTTON COMPONENT ─────────────────────────────────────────────────────
function ReadBtn({ text, label = "🔊 Leer", small }) {
  const [playing, setPlaying] = useState(false);
  const ctrl = useMemo(() => ({ setPlaying }), []);
  const s = {
    display:"inline-flex", alignItems:"center", gap:"0.35rem",
    background: playing ? C.gold : "transparent",
    border:`1px solid ${playing ? C.gold : "rgba(201,168,76,0.3)"}`,
    color: playing ? C.ink : C.gold,
    fontFamily:"var(--serif)", fontSize: small ? "0.68rem" : "0.75rem",
    letterSpacing:"0.15em", textTransform:"uppercase",
    padding: small ? "0.2rem 0.55rem" : "0.3rem 0.75rem",
    cursor:"pointer", transition:"all 0.2s", borderRadius:2,
    marginTop:"0.5rem",
  };
  const waves = [4,8,14,6,12,10,5,9];
  return (
    <button style={s} onClick={() => toggleRead(text, ctrl)}>
      {playing ? (
        <span style={{display:"flex",alignItems:"center",gap:1}}>
          {waves.map((h,i) => <span key={i} className="wbar on" style={{height:h+"px"}}/>)}
        </span>
      ) : <span>🔊</span>}
      {playing ? "Leyendo…" : label}
    </button>
  );
}

// ── MAP COMPONENT ─────────────────────────────────────────────────────────────
function TourMap({ stops, activeDay, onSelectStop }) {
  const mapRef = useRef(null);
  const instanceRef = useRef(null);

  useEffect(() => {
    if (!mapRef.current || instanceRef.current) return;
    const allStops = stops.filter(s => s.lat && s.lng);
    if (!allStops.length) return;

    const center = [
      allStops.reduce((s,p) => s + p.lat, 0) / allStops.length,
      allStops.reduce((s,p) => s + p.lng, 0) / allStops.length,
    ];

    const map = L.map(mapRef.current, { center, zoom: 14, scrollWheelZoom: false });
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution:"© OpenStreetMap © CARTO", subdomains:"abcd", maxZoom:19
    }).addTo(map);

    // Draw route line per day
    activeDay && activeDay.stops && L.polyline(
      activeDay.stops.filter(s => s.lat && s.lng).map(s => [s.lat, s.lng]),
      { color: C.gold, weight: 2, opacity: 0.5, dashArray: "6,8" }
    ).addTo(map);

    allStops.forEach((stop, i) => {
      const color = stop.color || TYPE_COLORS[stop.type] || C.gold;
      const icon = L.divIcon({
        className: "",
        html: `<div style="width:28px;height:28px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,0.7);display:flex;align-items:center;justify-content:center;color:#0D1117;font-weight:700;font-size:0.72rem;box-shadow:0 2px 8px rgba(0,0,0,0.5);cursor:pointer;">${i + 1}</div>`,
        iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -16],
      });
      const marker = L.marker([stop.lat, stop.lng], { icon }).addTo(map);
      marker.bindPopup(
        `<div style="font-family:var(--serif);">
          <div style="font-size:0.65rem;color:${color};text-transform:uppercase;letter-spacing:0.15em;margin-bottom:0.2rem;">${stop.time || ""}</div>
          <div style="font-size:0.95rem;font-weight:600;margin-bottom:0.4rem;">${stop.name}</div>
          <button onclick="document.dispatchEvent(new CustomEvent('selectStop',{detail:'${stop.id}'}));" style="background:${color};border:none;color:#0D1117;font-size:0.75rem;padding:0.3rem 0.7rem;cursor:pointer;font-family:var(--serif);">Ver parada →</button>
        </div>`,
        { maxWidth: 200 }
      );
    });

    instanceRef.current = map;
  }, [stops, activeDay]);

  useEffect(() => {
    const handler = (e) => onSelectStop && onSelectStop(e.detail);
    document.addEventListener("selectStop", handler);
    return () => document.removeEventListener("selectStop", handler);
  }, [onSelectStop]);

  return <div ref={mapRef} style={{ width:"100%", maxWidth:900, height:380, margin:"0 auto", border:`1px solid ${C.border}` }} />;
}

// ── DETAIL PANEL ──────────────────────────────────────────────────────────────
function DetailPanel({ stop, onClose }) {
  const [detailContent, setDetailContent] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  async function loadDetail() {
    if (detailContent || loading) return;
    setLoading(true); setError("");
    try {
      const prompt = `Genera contenido HTML detallado en español para la atracción turística: "${stop.name}" en ${stop.location || "España"}.
Usa exactamente estas clases CSS:
1) <div class='detail-section'><div class='detail-section-title'>Historia profunda</div><div class='detail-text'><p>3-4 párrafos ricos</p></div></div>
2) <div class='detail-section'><div class='detail-section-title'>Anécdotas y curiosidades</div><div class='anecdote-card'><div class='anecdote-title'>ANÉCDOTA</div><div class='anecdote-text'>texto</div></div><div class='anecdote-card'>...</div></div>
3) <div class='detail-section'><div class='detail-section-title'>Datos y cifras</div><div class='infographic'><div class='info-box'><span class='info-box-icon'>emoji</span><span class='info-box-val'>valor</span><div class='info-box-lbl'>etiqueta</div></div>×4</div></div>
4) <div class='detail-section'><div class='detail-section-title'>Línea del tiempo</div><div class='timeline'>5-7 eventos con año</div></div>
5) <div class='detail-section'><div class='detail-section-title'>Secretos y curiosidades ocultas</div><div class='detail-text'><p>...</p></div></div>
Solo el HTML, sin markdown.`;

      const res = await fetch("/.netlify/functions/claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: [{ role:"user", content:prompt }] }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      const text = data.content?.filter(b => b.type==="text").map(b => b.text).join("") || "";
      if (!text) throw new Error("Respuesta vacía");
      setDetailContent(text.replace(/^```html\n?/i,"").replace(/```$/m,"").trim());
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  }

  const allText = [stop.description, stop.history, stop.audioGuide, ...(stop.tips||[])].filter(Boolean).join(". ");

  return (
    <div style={{position:"fixed",inset:0,background:C.ink,zIndex:600,display:"flex",flexDirection:"column",overflowY:"hidden"}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:"0.8rem",padding:"0.9rem 1.2rem",borderBottom:`1px solid ${C.border}`,background:C.card,flexShrink:0}}>
        <button onClick={() => { stopAll(); onClose(); }} style={{width:36,height:36,borderRadius:"50%",border:`1px solid ${C.border}`,background:"transparent",color:"var(--parch)",fontSize:"1rem",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
        <div style={{fontFamily:"var(--display)",fontSize:"1rem",color:C.ivory,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{stop.name}</div>
        <ReadBtn text={allText} label="🔊 Leer" small />
        <button onClick={loadDetail} style={{background:"transparent",border:`1px solid rgba(201,168,76,0.4)`,color:C.gold,fontFamily:"var(--serif)",fontSize:"0.72rem",letterSpacing:"0.15em",textTransform:"uppercase",padding:"0.35rem 0.8rem",cursor:"pointer",whiteSpace:"nowrap"}}>
          ✦ Explorar
        </button>
      </div>

      {/* Body */}
      <div style={{flex:1,overflowY:"auto",padding:"1.5rem 1.2rem",WebkitOverflowScrolling:"touch"}}>
        {/* Facts */}
        {stop.facts && stop.facts.length > 0 && (
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"0.6rem",marginBottom:"1.5rem"}}>
            {stop.facts.map((f,i) => (
              <div key={i} style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,padding:"0.8rem",textAlign:"center"}}>
                <div style={{fontFamily:"var(--display)",fontSize:"1.3rem",color:C.gold}}>{f.value}</div>
                <div style={{fontSize:"0.62rem",letterSpacing:"0.18em",textTransform:"uppercase",color:C.parch,opacity:0.5,marginTop:"0.1rem"}}>{f.label}</div>
              </div>
            ))}
          </div>
        )}

        {/* Description */}
        <p style={{fontSize:"1rem",lineHeight:1.9,color:C.parch,marginBottom:"0.5rem",fontWeight:300}}>{stop.description}</p>
        <ReadBtn text={stop.description} label="🔊 Descripción" small />

        {/* History */}
        {stop.history && (
          <div style={{background:"rgba(201,168,76,0.05)",borderLeft:`2px solid ${C.gold}`,padding:"1rem 1.2rem",margin:"1.2rem 0 0.4rem"}}>
            <div style={{fontSize:"0.68rem",letterSpacing:"0.3em",textTransform:"uppercase",color:C.gold,marginBottom:"0.4rem",fontFamily:"var(--display)"}}>📜 Historia</div>
            <p style={{fontStyle:"italic",fontSize:"0.92rem",color:C.parch,lineHeight:1.75,opacity:0.87}}>{stop.history}</p>
          </div>
        )}
        {stop.history && <ReadBtn text={stop.history} label="🔊 Historia" small />}

        {/* Audio guide */}
        {stop.audioGuide && (
          <div style={{background:"rgba(201,168,76,0.04)",border:`1px solid ${C.border}`,padding:"1rem 1.2rem",margin:"1.2rem 0 0.4rem"}}>
            <div style={{fontSize:"0.68rem",letterSpacing:"0.3em",textTransform:"uppercase",color:C.gold,marginBottom:"0.4rem",fontFamily:"var(--display)"}}>🎧 Audioguía</div>
            <p style={{fontStyle:"italic",fontSize:"0.9rem",color:C.parch,lineHeight:1.75,opacity:0.8}}>{stop.audioGuide}</p>
          </div>
        )}
        {stop.audioGuide && <ReadBtn text={stop.audioGuide} label="🔊 Audioguía" small />}

        {/* Dishes */}
        {stop.dishes && stop.dishes.length > 0 && (
          <div style={{background:"rgba(181,84,27,0.07)",border:"1px solid rgba(181,84,27,0.22)",padding:"1rem 1.2rem",margin:"1.2rem 0"}}>
            <div style={{fontSize:"0.68rem",letterSpacing:"0.35em",textTransform:"uppercase",color:C.terra,marginBottom:"0.8rem",fontFamily:"var(--display)"}}>🍽 Qué pedir</div>
            {stop.dishes.map((d,i) => (
              <div key={i} style={{borderBottom:i<stop.dishes.length-1?`1px dotted ${C.border}`:"none",paddingBottom:"0.4rem",marginBottom:"0.4rem"}}>
                <div style={{fontFamily:"var(--display)",fontSize:"0.95rem",color:C.ivory}}>{d.name}</div>
                <div style={{fontSize:"0.78rem",color:C.parch,opacity:0.6,fontStyle:"italic",marginTop:"0.1rem"}}>{d.description}</div>
              </div>
            ))}
          </div>
        )}

        {/* Tips */}
        {stop.tips && stop.tips.length > 0 && (
          <div style={{marginTop:"1.2rem"}}>
            <div style={{fontSize:"0.68rem",letterSpacing:"0.3em",textTransform:"uppercase",color:C.gold,marginBottom:"0.6rem",fontFamily:"var(--display)"}}>💡 Consejos</div>
            <ul style={{listStyle:"none",display:"flex",flexDirection:"column",gap:"0.4rem"}}>
              {stop.tips.map((t,i) => (
                <li key={i} style={{display:"flex",gap:"0.5rem",alignItems:"flex-start",fontSize:"0.88rem",color:C.parch,opacity:0.75,lineHeight:1.5}}>
                  <span style={{color:C.gold,fontSize:"0.45rem",marginTop:"0.4rem",flexShrink:0}}>◆</span>{t}
                </li>
              ))}
            </ul>
            <ReadBtn text={stop.tips.join(". ")} label="🔊 Consejos" small />
          </div>
        )}

        {/* AI Detail */}
        {(loading || detailContent || error) && (
          <div style={{marginTop:"1.5rem",borderTop:`1px solid ${C.border}`,paddingTop:"1.5rem"}}>
            <div style={{fontSize:"0.68rem",letterSpacing:"0.3em",textTransform:"uppercase",color:C.gold,marginBottom:"1rem",fontFamily:"var(--display)"}}>✦ Detalle expandido · IA</div>
            {loading && (
              <div style={{display:"flex",alignItems:"center",gap:"0.8rem",padding:"1rem",color:C.parch,opacity:0.6,fontStyle:"italic"}}>
                <div style={{width:20,height:20,border:`1px solid ${C.gold}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
                Generando contenido con IA…
              </div>
            )}
            {error && <div style={{color:"#e84040",fontSize:"0.85rem",padding:"0.5rem"}}>{error}</div>}
            {detailContent && (
              <>
                <style>{`
                  .detail-section{margin-bottom:1.8rem;}
                  .detail-section-title{font-family:var(--display);font-size:1.1rem;color:var(--gold);background:rgba(201,168,76,0.08);border-left:3px solid var(--gold);padding:0.5rem 0.9rem;margin-bottom:0.9rem;display:block;}
                  .detail-text,.detail-text p{font-size:0.95rem;line-height:1.9;color:var(--parch);font-weight:300;background:transparent;margin-bottom:0.9rem;}
                  .anecdote-card{background:rgba(201,168,76,0.05);border:1px solid rgba(201,168,76,0.2);border-left:3px solid var(--gold);padding:1rem 1.2rem;margin:0.8rem 0;}
                  .anecdote-title{font-size:0.65rem;letter-spacing:0.35em;text-transform:uppercase;color:var(--gold);margin-bottom:0.4rem;display:block;}
                  .anecdote-text{font-style:italic;font-size:0.9rem;color:var(--parch);line-height:1.75;}
                  .infographic{display:grid;grid-template-columns:repeat(2,1fr);gap:0.7rem;margin:0.8rem 0;}
                  .info-box{background:var(--card);border:1px solid var(--border);padding:0.9rem;text-align:center;}
                  .info-box-icon{font-size:1.4rem;display:block;margin-bottom:0.2rem;}
                  .info-box-val{font-family:var(--display);font-size:1.3rem;color:var(--gold);display:block;}
                  .info-box-lbl{font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--parch);opacity:0.5;}
                  .timeline{display:flex;flex-direction:column;gap:0;}
                  .tl-item{display:flex;gap:0.8rem;padding-bottom:1rem;}
                  .tl-left{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:2.5rem;}
                  .tl-year{font-family:var(--display);font-size:0.72rem;color:var(--gold);text-align:center;}
                  .tl-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin:0.3rem auto 0;flex-shrink:0;}
                  .tl-line{width:1px;flex:1;background:var(--border);margin-top:0.2rem;min-height:0.8rem;}
                  .tl-event{font-size:0.88rem;color:var(--ivory);line-height:1.5;}
                  .tl-detail{font-size:0.76rem;color:var(--parch);opacity:0.6;font-style:italic;margin-top:0.15rem;}
                  @keyframes spin{to{transform:rotate(360deg)}}
                `}</style>
                <div dangerouslySetInnerHTML={{__html: detailContent}} />
                <ReadBtn text={document.querySelector('.detail-text')?.innerText || ""} label="🔊 Leer todo" />
              </>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ── STOP CARD ─────────────────────────────────────────────────────────────────
function StopCard({ stop, index, onOpen }) {
  const color = stop.color || TYPE_COLORS[stop.type] || C.gold;
  const photo = stop.photos && stop.photos[0];

  return (
    <div style={{background:C.card,border:`1px solid ${C.border}`,overflow:"hidden",cursor:"pointer"}} onClick={() => onOpen(stop)}>
      {/* Photo or placeholder */}
      <div style={{height:140,overflow:"hidden",position:"relative",background:"#080d14"}}>
        {photo ? (
          <img src={photo} alt={stop.name} style={{width:"100%",height:"100%",objectFit:"cover",opacity:0.85,transition:"transform 0.4s"}}
            onMouseOver={e=>e.target.style.transform="scale(1.05)"} onMouseOut={e=>e.target.style.transform="scale(1)"} />
        ) : (
          <div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",opacity:0.15}}>
            <div style={{fontFamily:"var(--display)",fontSize:"4rem",color:color}}>{String(index+1).padStart(2,"0")}</div>
          </div>
        )}
        <div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,transparent 50%,rgba(13,17,23,0.85))"}} />
        <div style={{position:"absolute",bottom:"0.6rem",left:"0.7rem",fontSize:"0.68rem",letterSpacing:"0.3em",color:color,textTransform:"uppercase"}}>{stop.time} · {stop.duration}</div>
        <div style={{position:"absolute",top:"0.6rem",left:"0.7rem",width:26,height:26,borderRadius:"50%",background:color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.72rem",fontWeight:700,color:C.ink}}>{index+1}</div>
      </div>
      <div style={{padding:"0.9rem"}}>
        <div style={{fontSize:"0.65rem",letterSpacing:"0.35em",textTransform:"uppercase",color:color,marginBottom:"0.25rem"}}>{stop.type}</div>
        <div style={{fontFamily:"var(--display)",fontSize:"1.05rem",color:C.ivory,marginBottom:"0.2rem"}}>{stop.name}</div>
        <div style={{fontStyle:"italic",fontSize:"0.82rem",color:C.parch,opacity:0.7,lineHeight:1.4}}>{stop.subtitle}</div>
      </div>
    </div>
  );
}

// ── HERO ──────────────────────────────────────────────────────────────────────
function Hero({ meta }) {
  return (
    <div style={{minHeight:"100vh",position:"relative",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",overflow:"hidden"}}>
      <div style={{
        position:"absolute",inset:0,
        background: meta.heroImage ? `url(${meta.heroImage}) center/cover no-repeat` : "radial-gradient(ellipse at center, #2a1505 0%, #050208 100%)",
        filter:"brightness(0.3) saturate(0.7)",
      }} />
      <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at center,transparent 30%,#0D1117 100%)"}} />
      <div style={{position:"relative",zIndex:2,padding:"2rem 1.5rem",maxWidth:700}}>
        <div style={{fontSize:"0.72rem",letterSpacing:"0.55em",color:C.gold,textTransform:"uppercase",marginBottom:"1.2rem",opacity:0.9}}>
          Guía Turística Interactiva
        </div>
        <h1 style={{fontFamily:"var(--display)",fontSize:"clamp(3rem,10vw,7rem)",lineHeight:0.95,color:C.ivory}}>
          {meta.title}<br/><em style={{color:C.gold,fontStyle:"italic"}}>{meta.subtitle}</em>
        </h1>
        <p style={{fontStyle:"italic",fontSize:"clamp(0.95rem,2.5vw,1.25rem)",color:C.parch,maxWidth:560,margin:"1.8rem auto 2.5rem",lineHeight:1.85,opacity:0.85}}>
          {meta.description}
        </p>
        <div style={{display:"flex",gap:"1rem",justifyContent:"center",flexWrap:"wrap"}}>
          <a href="#tour" style={{display:"inline-flex",alignItems:"center",gap:"0.5rem",border:`1px solid ${C.gold}`,color:C.gold,background:"transparent",fontFamily:"var(--serif)",fontSize:"0.88rem",letterSpacing:"0.3em",textTransform:"uppercase",padding:"0.9rem 2.2rem",textDecoration:"none",transition:"all 0.3s"}}
            onMouseOver={e=>{e.target.style.background=C.gold;e.target.style.color=C.ink;}} onMouseOut={e=>{e.target.style.background="transparent";e.target.style.color=C.gold;}}>
            ▶ Comenzar visita
          </a>
          <a href="#map" style={{display:"inline-flex",alignItems:"center",gap:"0.5rem",border:`1px solid rgba(201,168,76,0.35)`,color:C.parch,background:"transparent",fontFamily:"var(--serif)",fontSize:"0.88rem",letterSpacing:"0.3em",textTransform:"uppercase",padding:"0.9rem 2.2rem",textDecoration:"none"}}>
            ▼ Ver mapa
          </a>
        </div>
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [tour, setTour] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [activeDay, setActiveDay] = useState(0);
  const [openStop, setOpenStop] = useState(null);

  useEffect(() => {
    const repoPath = RAW_BASE + "/data/tour.json";
    fetch(repoPath + "?t=" + Date.now())
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(data => { setTour(data); setLoading(false); })
      .catch(e => { setError(e.message); setLoading(false); });
  }, []);

  useEffect(() => {
    if (window.speechSynthesis) window.speechSynthesis.getVoices();
  }, []);

  if (loading) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:"1rem"}}>
      <div style={{width:40,height:40,border:`2px solid rgba(201,168,76,0.3)`,borderTopColor:C.gold,borderRadius:"50%",animation:"spin 0.9s linear infinite"}} />
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      <div style={{fontStyle:"italic",color:C.parch,opacity:0.5}}>Cargando ruta…</div>
    </div>
  );

  if (error || !tour) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:C.parch,flexDirection:"column",gap:"0.5rem",padding:"2rem",textAlign:"center"}}>
      <div style={{fontSize:"1.2rem",color:C.gold}}>No se pudo cargar la ruta</div>
      <div style={{opacity:0.6,fontSize:"0.9rem"}}>{error}</div>
    </div>
  );

  const days = tour.days || [];
  const day = days[activeDay] || days[0];
  const allStops = days.flatMap(d => d.stops || []).filter(s => s.lat && s.lng);

  return (
    <>
      <Hero meta={tour.meta || {}} />

      {/* Day tabs */}
      {days.length > 1 && (
        <div id="tour" style={{borderBottom:`1px solid ${C.border}`,background:C.card}}>
          <div style={{display:"flex",overflowX:"auto",scrollbarWidth:"none",maxWidth:1200,margin:"0 auto"}}>
            {days.map((d,i) => (
              <button key={d.id} onClick={() => setActiveDay(i)} style={{
                flexShrink:0, background:"transparent", border:"none",
                borderBottom: activeDay===i ? `2px solid ${C.gold}` : "2px solid transparent",
                color: activeDay===i ? C.gold : C.parch,
                fontFamily:"var(--serif)", fontSize:"0.8rem", letterSpacing:"0.2em",
                textTransform:"uppercase", padding:"1rem 1.5rem", cursor:"pointer",
                transition:"all 0.2s", opacity: activeDay===i ? 1 : 0.6,
              }}>
                {d.title || "Día " + (i+1)}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Map */}
      <div id="map" style={{padding:"4rem 1.5rem 3rem",background:C.ink,borderTop:`1px solid ${C.border}`}}>
        <div style={{textAlign:"center",marginBottom:"2rem"}}>
          <div style={{fontSize:"0.72rem",letterSpacing:"0.5em",textTransform:"uppercase",color:C.terra,marginBottom:"0.4rem"}}>Ruta completa</div>
          <h2 style={{fontFamily:"var(--display)",fontSize:"clamp(1.8rem,4vw,2.8rem)",color:C.ivory}}>{day?.title || "Mapa de la ruta"}</h2>
        </div>
        <TourMap stops={allStops} activeDay={day} onSelectStop={(id) => {
          const s = allStops.find(s => s.id === id);
          if (s) { setOpenStop(s); }
        }} />
      </div>

      {/* Stops grid */}
      <div id="stops" style={{padding:"3rem 1.5rem",maxWidth:1200,margin:"0 auto"}}>
        {day?.description && <p style={{textAlign:"center",fontStyle:"italic",color:C.parch,opacity:0.65,marginBottom:"2rem",fontSize:"1rem"}}>{day.description}</p>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:"1.2rem"}}>
          {(day?.stops || []).map((stop, i) => (
            <StopCard key={stop.id} stop={stop} index={i} onOpen={setOpenStop} />
          ))}
        </div>
      </div>

      {/* Detail panel */}
      {openStop && <DetailPanel stop={openStop} onClose={() => setOpenStop(null)} />}

      {/* Admin fab */}
      <a href="/admin.html" style={{
        position:"fixed", bottom:"1.5rem", right:"1.5rem", zIndex:200,
        background:`rgba(13,17,23,0.95)`, border:`1px solid ${C.gold}`,
        color:C.gold, textDecoration:"none", fontFamily:"var(--serif)",
        fontSize:"0.72rem", letterSpacing:"0.2em", textTransform:"uppercase",
        padding:"0.65rem 1rem", display:"flex", alignItems:"center", gap:"0.4rem",
        boxShadow:"0 4px 20px rgba(0,0,0,0.4)", transition:"all 0.2s",
      }} onMouseOver={e=>{e.currentTarget.style.background=C.gold;e.currentTarget.style.color=C.ink;}}
         onMouseOut={e=>{e.currentTarget.style.background="rgba(13,17,23,0.95)";e.currentTarget.style.color=C.gold;}}>
        ⚙ Admin
      </a>

      {/* Version */}
      <div style={{textAlign:"center",padding:"2rem",fontSize:"0.65rem",color:C.parch,opacity:0.25,letterSpacing:"0.2em"}}>
        v3.0 · Tour Guiado App
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
