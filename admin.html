<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Tour CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--ivory:#F5EFE0;--parch:#EDE3C8;
  --terra:#B5541B;--ink:#0D1117;--card:#131920;--smoke:#1E2535;
  --border:rgba(201,168,76,0.18);--err:#e84040;--rest:#E84040;
  --serif:'Cormorant Garamond',Georgia,serif;--display:'Playfair Display',Georgia,serif;
}
html,body{height:100%;background:var(--ink);color:var(--ivory);font-family:var(--serif);font-size:16px;overflow:hidden;}
button,input,select,textarea{font-family:var(--serif);}
button{cursor:pointer;}
a{color:var(--gold);text-decoration:none;}
.topbar{display:flex;align-items:center;gap:1rem;padding:0.9rem 1.5rem;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.topbar-title{font-family:var(--display);font-size:1.1rem;color:var(--gold);flex:1;}
.topbar-title span{color:var(--ivory);font-style:italic;font-size:0.85rem;}
.main{display:flex;flex:1;overflow:hidden;min-height:0;}
.sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;overflow-y:auto;}
.content{flex:1;overflow-y:auto;padding:1.4rem;}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;}
.login-box{background:var(--card);border:1px solid var(--border);padding:2.5rem;width:340px;text-align:center;}
.login-title{font-family:var(--display);font-size:1.5rem;color:var(--gold);margin-bottom:0.3rem;}
.login-sub{font-style:italic;color:var(--parch);opacity:0.6;margin-bottom:1.5rem;font-size:0.88rem;}
.inp{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--ivory);font-family:var(--serif);font-size:0.95rem;padding:0.65rem 0.9rem;outline:none;transition:border .2s;}
.inp:focus{border-color:var(--gold);}
textarea.inp{resize:vertical;min-height:72px;line-height:1.6;}
select.inp option{background:#131920;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;background:transparent;border:1px solid rgba(201,168,76,0.35);color:var(--parch);font-family:var(--serif);font-size:0.78rem;letter-spacing:0.15em;text-transform:uppercase;padding:0.5rem 1rem;transition:all .2s;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600;}
.btn-gold:hover{background:var(--gold2);}
.btn-sm{font-size:0.7rem;padding:0.28rem 0.65rem;}
.btn-danger{border-color:rgba(232,64,64,0.3);color:rgba(232,64,64,0.65);}
.btn-danger:hover{border-color:var(--err);color:var(--err);}
.btn-icon{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.sidebar-sec{padding:0.7rem 1rem;font-size:0.62rem;letter-spacing:0.4em;text-transform:uppercase;color:var(--gold);opacity:0.55;border-top:1px solid var(--border);}
.sidebar-sec:first-child{border-top:none;}
.day-item{display:flex;align-items:center;gap:0.5rem;padding:0.6rem 1rem;cursor:pointer;transition:background .15s;border-left:2px solid transparent;}
.day-item:hover{background:rgba(255,255,255,0.04);}
.day-item.active{background:rgba(201,168,76,0.07);border-left-color:var(--gold);}
.day-num{width:20px;height:20px;border-radius:50%;background:rgba(201,168,76,0.15);display:flex;align-items:center;justify-content:center;font-size:0.68rem;color:var(--gold);flex-shrink:0;}
.stop-row{background:var(--card);border:1px solid var(--border);padding:0.8rem 0.9rem;margin-bottom:0.5rem;display:flex;align-items:center;gap:0.7rem;transition:border .2s;}
.stop-row:hover{border-color:rgba(201,168,76,0.35);}
.stop-row.dragover{border-color:var(--gold);background:rgba(201,168,76,0.06);}
.drag-handle{cursor:grab;color:rgba(201,168,76,0.25);font-size:1rem;flex-shrink:0;}
.panel{background:var(--card);border:1px solid var(--border);padding:1.3rem;margin-bottom:1rem;}
.panel-title{font-family:var(--display);font-size:0.95rem;color:var(--gold);margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border);}
.field{margin-bottom:0.85rem;}
.field label{display:block;font-size:0.63rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);opacity:0.65;margin-bottom:0.35rem;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.7rem;}
.wizard{background:rgba(201,168,76,0.04);border:1px solid rgba(201,168,76,0.22);padding:1.2rem;margin-bottom:1rem;}
.wizard-title{font-family:var(--display);font-size:0.95rem;color:var(--gold);margin-bottom:0.9rem;}
.spinner{width:18px;height:18px;border:2px solid rgba(201,168,76,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.2rem;}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--parch);font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;padding:0.65rem 1.1rem;cursor:pointer;opacity:0.6;transition:all .2s;}
.tab-btn.active{border-bottom-color:var(--gold);color:var(--gold);opacity:1;}
.section-card{background:rgba(255,255,255,0.03);border:1px solid var(--border);padding:1rem;margin-bottom:0.7rem;}
.section-card-header{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.7rem;}
#toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--card);border:1px solid var(--border);padding:0.65rem 1rem;font-size:0.83rem;z-index:999;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;max-width:300px;}
#toast.show{opacity:1;transform:translateY(0);}
#toast.ok{border-color:var(--gold);color:var(--gold);}
#toast.err{border-color:var(--err);color:var(--err);}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div class="login-title">Tour CMS</div>
    <div class="login-sub">Panel de administración</div>
    <input type="password" class="inp" id="tok" placeholder="Contraseña" style="margin-bottom:0.7rem;" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="doLogin()">Entrar</button>
    <div id="lerr" style="color:var(--err);font-size:0.8rem;margin-top:0.6rem;display:none;">Contraseña incorrecta</div>
  </div>
</div>

<div id="cms" style="display:none;flex-direction:column;height:100vh;">
  <div class="topbar">
    <div class="topbar-title">Tour CMS <span>· Admin</span></div>
    <a href="/" class="btn btn-sm">← Guía</a>
    <button id="save-btn" class="btn btn-gold btn-sm" onclick="saveTour()" disabled>💾 Guardar</button>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-sec">Destino</div>
      <div style="padding:0.7rem 1rem;">
        <button class="btn btn-sm" style="width:100%;justify-content:center;" onclick="showMeta()">⚙ Configuración</button>
      </div>
      <div class="sidebar-sec">Días de ruta</div>
      <div id="days-list"></div>
      <div style="padding:0.7rem 1rem;">
        <button class="btn btn-sm" style="width:100%;justify-content:center;" onclick="addDay()">+ Añadir día</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fup" accept="image/jpeg,image/png,image/webp" style="display:none">

<script>
// Global error trap
window.onerror = function(msg, src, line, col, err) {
  var el = document.getElementById('dbg-log');
  if (!el) {
    el = document.createElement('div');
    el.id = 'dbg-log';
    el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#000;color:#f00;font-size:11px;padding:8px;z-index:9999;max-height:40vh;overflow-y:auto;font-family:monospace;';
    document.body.appendChild(el);
  }
  el.innerHTML += '<div>JS ERROR: ' + msg + ' (line ' + line + ')</div>';
  return false;
};

var ADMIN_TOKEN='', tour=null, activeDayIdx=null, activeDay=null, editIdx=null, dirty=false, wikiPhotos=[], dragSrc=null;

var TYPES=[
  {id:'monument',   label:'Monumento',       icon:'🏛', color:'#C9A84C'},
  {id:'restaurant', label:'Restaurante',      icon:'🍽', color:'#E84040'},
  {id:'neighborhood',label:'Barrio/Zona',    icon:'🏘', color:'#7A9E9F'},
  {id:'museum',     label:'Museo',            icon:'🎨', color:'#6B7FA3'},
  {id:'viewpoint',  label:'Mirador/Natural',  icon:'🌿', color:'#5A8A5E'},
  {id:'market',     label:'Mercado',          icon:'🛍', color:'#8B5E3C'},
  {id:'other',      label:'Otro',             icon:'📍', color:'#9A8A7A'},
];

function tmeta(type){return TYPES.find(function(t){return t.id===type;})||TYPES[TYPES.length-1];}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function dbg(msg){
  var el=document.getElementById('dbg-log');
  if(!el){el=document.createElement('div');el.id='dbg-log';
    el.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font-size:11px;padding:8px;z-index:9999;max-height:40vh;overflow-y:auto;font-family:monospace;';
    document.body.appendChild(el);}
  el.innerHTML+='<div>'+new Date().toISOString().slice(11,19)+' '+msg+'</div>';
  el.scrollTop=el.scrollHeight;
}

function doLogin(){
  try{
    dbg('doLogin start');
    ADMIN_TOKEN=document.getElementById('tok').value.trim();
    if(!ADMIN_TOKEN){dbg('no token');return;}
    dbg('token set, calling loadTour');
    var btn=document.querySelector('.login-box .btn-gold');
    if(btn){btn.disabled=true;btn.textContent='Cargando…';}
    loadTour(function(ok){
      dbg('loadTour callback ok='+ok);
      try{
        if(btn){btn.disabled=false;btn.textContent='Entrar';}
        if(ok){
          dbg('showing CMS');
          document.getElementById('login').style.display='none';
          document.getElementById('cms').style.display='flex';
          dbg('calling renderSidebar');
          renderSidebar();
          dbg('calling showMeta');
          showMeta();
          dbg('done');
        } else {
          dbg('ok=false, showing error');
          document.getElementById('lerr').style.display='block';
          ADMIN_TOKEN='';
        }
      }catch(e){
        dbg('ERROR in callback: '+e.message+' line:'+e.lineNumber);
        if(btn){btn.disabled=false;btn.textContent='Entrar';}
        alert('Error callback: '+e.message);
      }
    });
  }catch(e){
    dbg('ERROR in doLogin: '+e.message);
    alert('Error: '+e.message);
  }
}

function loadTour(cb){
  function makeFreshTour(){
    return {meta:{title:'Mi Tour',subtitle:'',description:'',heroImage:'',videoUrl:'',version:'3.1',updatedAt:new Date().toISOString()},days:[]};
  }
  try{
    fetch('/data/tour.json?t='+Date.now())
      .then(function(r){
        if(!r.ok)throw new Error('HTTP '+r.status);
        return r.json();
      })
      .then(function(d){
        tour=d;
        if(!tour.meta)tour.meta=makeFreshTour().meta;
        if(!tour.days)tour.days=[];
        if(cb)cb(true);
      })
      .catch(function(e){
        console.log('tour.json not found, starting fresh:', e.message);
        tour=makeFreshTour();
        if(cb)cb(true);
      });
  }catch(e){
    tour=makeFreshTour();
    if(cb)cb(true);
  }
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function renderSidebar(){
  document.getElementById('days-list').innerHTML=(tour.days||[]).map(function(d,i){
    var active=activeDayIdx===i;
    return '<div class="day-item'+(active?' active':'')+'" onclick="selectDay('+i+')">' +
      '<div class="day-num">'+(i+1)+'</div>' +
      '<div style="flex:1;font-size:0.82rem;color:var(--parch);">'+esc(d.title||'Día '+(i+1))+'</div>' +
      '<div style="font-size:0.65rem;color:var(--parch);opacity:0.4;">'+(d.stops||[]).length+'</div>' +
    '</div>';
  }).join('');
}

function selectDay(idx){activeDayIdx=idx;activeDay=tour.days[idx];editIdx=null;renderSidebar();showDay();}
function addDay(){
  var n=(tour.days||[]).length+1;
  tour.days.push({id:'day-'+Date.now(),title:'Día '+n,description:'',stops:[]});
  markDirty();renderSidebar();selectDay(tour.days.length-1);
}

// ── META ──────────────────────────────────────────────────────────────────────
function showMeta(){
  var m=tour.meta||{};
  document.getElementById('content').innerHTML=
    '<div class="panel"><div class="panel-title">Información del destino</div>' +
    '<div class="field"><label>Nombre del destino</label><input class="inp" id="m-title" value="'+esc(m.title||'')+'" oninput="updateMeta()"></div>' +
    '<div class="field"><label>Subtítulo / Tagline</label><input class="inp" id="m-sub" value="'+esc(m.subtitle||'')+'" oninput="updateMeta()"></div>' +
    '<div class="field"><label>Descripción</label><textarea class="inp" id="m-desc" oninput="updateMeta()">'+esc(m.description||'')+'</textarea></div>' +
    '<div class="field"><label>URL imagen de portada (hero)</label><input class="inp" id="m-hero" value="'+esc(m.heroImage||'')+'" oninput="updateMeta()" placeholder="https://..."></div>' +
    '<div class="field"><label>📹 URL vídeo YouTube del destino (opcional)</label><input class="inp" id="m-video" value="'+esc(m.videoUrl||'')+'" oninput="updateMeta()" placeholder="https://www.youtube.com/watch?v=..."></div>' +
    '</div>';
}

function updateMeta(){
  if(!tour.meta)tour.meta={};
  tour.meta.title=document.getElementById('m-title').value;
  tour.meta.subtitle=document.getElementById('m-sub').value;
  tour.meta.description=document.getElementById('m-desc').value;
  tour.meta.heroImage=document.getElementById('m-hero').value;
  tour.meta.videoUrl=document.getElementById('m-video').value;
  markDirty();
}

// ── DAY ───────────────────────────────────────────────────────────────────────
function showDay(){
  if(!activeDay)return;
  document.getElementById('content').innerHTML=
    '<div class="panel"><div class="panel-title">'+esc(activeDay.title||'Día')+'</div>' +
    '<div class="field-row"><div class="field"><label>Título del día</label><input class="inp" id="dt" value="'+esc(activeDay.title||'')+'" oninput="updateDay()"></div>' +
    '<div class="field"><label>Descripción</label><input class="inp" id="dd" value="'+esc(activeDay.description||'')+'" oninput="updateDay()"></div></div>' +
    '<button class="btn btn-danger btn-sm" onclick="deleteDay()">🗑 Eliminar día</button></div>' +

    '<div class="wizard"><div class="wizard-title">➕ Añadir atracción</div>' +
    '<div class="field-row"><div class="field"><label>Nombre</label><input class="inp" id="nn" placeholder="Ej: Medina Azahara"></div>' +
    '<div class="field"><label>Ciudad / Lugar</label><input class="inp" id="nl" value="'+esc((tour.meta&&tour.meta.title)||'')+'" placeholder="Córdoba, España"></div></div>' +
    '<div class="field-row"><div class="field"><label>Tipo</label><select class="inp" id="nt">'+TYPES.map(function(t){return'<option value="'+t.id+'">'+t.icon+' '+t.label+'</option>';}).join('')+'</select></div>' +
    '<div class="field"><label>Hora</label><input class="inp" id="ntm" placeholder="09:00"></div></div>' +
    '<div style="display:flex;gap:0.6rem;flex-wrap:wrap;">' +
    '<button class="btn btn-gold" onclick="genStop()">✨ Generar con IA</button>' +
    '<button class="btn" onclick="addManual()">+ Manual</button></div>' +
    '<div id="genbar" style="display:none;margin-top:0.7rem;display:none;align-items:center;gap:0.6rem;padding:0.7rem;background:rgba(201,168,76,0.04);border:1px solid var(--border);"><div class="spinner"></div><div id="genmsg" style="font-size:0.85rem;color:var(--parch);opacity:0.7;font-style:italic;">Generando…</div></div>' +
    '</div>' +

    '<div class="panel"><div class="panel-title">Paradas <span style="opacity:0.4;font-size:0.78rem;">· Arrastra para reordenar</span></div>' +
    '<div id="stops-list">'+renderStops()+'</div></div>' +
    '<div id="stop-editor"></div>';

  initDrag();
}

function updateDay(){if(!activeDay)return;activeDay.title=document.getElementById('dt').value;activeDay.description=document.getElementById('dd').value;renderSidebar();markDirty();}
function deleteDay(){if(!confirm('¿Eliminar este día?'))return;tour.days.splice(activeDayIdx,1);activeDayIdx=null;activeDay=null;renderSidebar();document.getElementById('content').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:60%;opacity:0.3;font-style:italic;">Selecciona un día</div>';markDirty();}

function renderStops(){
  if(!activeDay||!(activeDay.stops||[]).length)return '<div style="padding:1rem;text-align:center;opacity:0.4;font-style:italic;font-size:0.88rem;">Sin paradas. Usa el formulario de arriba.</div>';
  return activeDay.stops.map(function(s,i){
    var tm=tmeta(s.type);
    return '<div class="stop-row" draggable="true" data-idx="'+i+'">' +
      '<div class="drag-handle">⠿</div>' +
      '<div style="width:26px;height:26px;border-radius:'+(s.type==='restaurant'?'4px':'50%')+';background:'+tm.color+';display:flex;align-items:center;justify-content:center;font-size:'+(s.type==='restaurant'?'1rem':'0.7rem')+';color:#0D1117;font-weight:700;flex-shrink:0;">'+(s.type==='restaurant'?tm.icon:(i+1))+'</div>' +
      '<div style="flex:1;min-width:0;"><div style="font-size:0.9rem;color:var(--ivory);">'+esc(s.name)+'</div><div style="font-size:0.7rem;color:var(--parch);opacity:0.5;">'+tm.icon+' '+tm.label+(s.time?' · '+s.time:'')+'</div></div>' +
      '<div style="display:flex;gap:0.35rem;">' +
      '<button class="btn btn-sm btn-icon" onclick="editStop('+i+')">✏️</button>' +
      '<button class="btn btn-sm btn-icon btn-danger" onclick="delStop('+i+')">🗑</button>' +
      '</div></div>';
  }).join('');
}

// ── GENERATE ──────────────────────────────────────────────────────────────────
async function genStop(){
  var name=document.getElementById('nn').value.trim();
  var loc=document.getElementById('nl').value.trim();
  var type=document.getElementById('nt').value;
  var time=document.getElementById('ntm').value.trim();
  if(!name){toast('Escribe el nombre','err');return;}
  if(!loc){toast('Escribe la ciudad','err');return;}
  var bar=document.getElementById('genbar');
  bar.style.display='flex';
  document.getElementById('genmsg').textContent='🤖 Claude generando contenido…';
  try{
    var res=await fetch('/.netlify/functions/generate',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':ADMIN_TOKEN},body:JSON.stringify({name:name,location:loc,type:type,city:tour.meta&&tour.meta.title})});
    var d=await res.json();
    if(d.error)throw new Error(d.error);
    var stop=d.stop;
    stop.time=time||stop.suggestedTime||'';
    stop.duration=stop.suggestedDuration||'60 min';
    stop.photos=[];stop.audioSections=stop.audioSections||[];
    stop.videoUrl='';stop.website='';stop.bookingUrl='';stop.phone='';stop.priceRange='';
    stop.address='';
    document.getElementById('genmsg').textContent='🖼 Buscando fotos en Wikimedia…';
    try{
      var wr=await fetch('/.netlify/functions/wikimedia?query='+encodeURIComponent(name+' '+loc));
      var wd=await wr.json();
      if(wd.ok&&wd.photos&&wd.photos.length)stop.photos=wd.photos.slice(0,3).map(function(p){return p.url;});
    }catch(e){}
    if(!activeDay.stops)activeDay.stops=[];
    activeDay.stops.push(stop);
    markDirty();
    document.getElementById('nn').value='';document.getElementById('ntm').value='';
    bar.style.display='none';
    showDay();
    setTimeout(function(){editStop(activeDay.stops.length-1);},80);
    toast('✓ "'+name+'" añadida con IA','ok');
  }catch(e){bar.style.display='none';toast('Error: '+e.message,'err');}
}

function addManual(){
  var name=document.getElementById('nn').value.trim()||'Nueva parada';
  var loc=document.getElementById('nl').value.trim();
  var type=document.getElementById('nt').value;
  var time=document.getElementById('ntm').value.trim();
  var tm=tmeta(type);
  var stop={id:'stop-'+Date.now(),name:name,location:loc,type:type,time:time,duration:'60 min',color:tm.color,
    subtitle:'',description:'',history:'',audioSections:[],videoUrl:'',
    facts:[],tips:[],photos:[],dishes:null,website:'',bookingUrl:'',phone:'',priceRange:'',address:'',
    order:(activeDay.stops||[]).length+1};
  if(!activeDay.stops)activeDay.stops=[];
  activeDay.stops.push(stop);
  markDirty();showDay();
  setTimeout(function(){editStop(activeDay.stops.length-1);},80);
}

// ── STOP EDITOR ───────────────────────────────────────────────────────────────
function editStop(idx){
  editIdx=idx;
  var s=activeDay.stops[idx];
  var tm=tmeta(s.type);
  var isRest=s.type==='restaurant';

  var sectionsHtml='';
  (s.audioSections||[]).forEach(function(sec,si){
    sectionsHtml+='<div class="section-card"><div class="section-card-header">' +
      '<div style="width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0;">'+(si+1)+'</div>' +
      '<div style="flex:1;font-size:0.88rem;color:var(--ivory);">'+esc(sec.title||'Sección '+(si+1))+'</div>' +
      '<button class="btn btn-sm btn-danger btn-icon" onclick="delSection('+si+')">✕</button></div>' +
      '<div class="field"><label>Título de la sección</label><input class="inp" id="sec-t-'+si+'" value="'+esc(sec.title||'')+'"></div>' +
      '<div class="field"><label>Texto de la narración</label><textarea class="inp" id="sec-x-'+si+'" style="min-height:90px;">'+esc(sec.text||'')+'</textarea></div>' +
      '<div class="field"><label>🗺 URL imagen mapa interior (opcional)</label><input class="inp" id="sec-m-'+si+'" value="'+esc(sec.mapImage||'')+'" placeholder="https://..."></div>' +
      '</div>';
  });

  var dishesHtml='';
  if(isRest){
    (s.dishes||[]).forEach(function(d,di){
      dishesHtml+='<div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;align-items:center;">' +
        '<input class="inp" id="dn-'+di+'" placeholder="Plato" value="'+esc(d.name||'')+'" style="flex:1;">' +
        '<input class="inp" id="dd-'+di+'" placeholder="Descripción" value="'+esc(d.description||'')+'" style="flex:2;">' +
        '<button class="btn btn-sm btn-danger btn-icon" onclick="delDish('+di+')">✕</button></div>';
    });
  }

  // Photo strip
  var photosHtml=(s.photos||[]).map(function(p,pi){
    return '<div style="position:relative;width:90px;height:68px;overflow:hidden;border:1px solid rgba(201,168,76,0.3);">' +
      '<img src="'+p+'" style="width:100%;height:100%;object-fit:cover;">' +
      '<button onclick="removePhoto('+pi+')" style="position:absolute;top:2px;right:2px;background:rgba(232,64,64,0.85);border:none;color:white;width:16px;height:16px;cursor:pointer;font-size:0.6rem;border-radius:2px;">✕</button></div>';
  }).join('');

  document.getElementById('stop-editor').innerHTML=
    '<div class="panel" style="border-color:rgba(201,168,76,0.3);">' +
    '<div style="display:flex;align-items:center;gap:0.7rem;margin-bottom:1rem;">' +
      '<div style="width:28px;height:28px;border-radius:'+(isRest?'4px':'50%')+';background:'+tm.color+';display:flex;align-items:center;justify-content:center;font-size:'+(isRest?'1rem':'0.75rem')+';color:#0D1117;font-weight:700;">'+tm.icon+'</div>' +
      '<div class="panel-title" style="margin-bottom:0;border:none;padding:0;flex:1;">Editando: '+esc(s.name)+'</div>' +
      '<button class="btn btn-sm" onclick="closeEditor()">✕</button></div>' +

    // Basic info tab
    '<div class="tab-bar"><button class="tab-btn active" id="tab-info" onclick="switchTab(\'info\')">Información</button>' +
    '<button class="tab-btn" id="tab-audio" onclick="switchTab(\'audio\')">🎧 Audioguía</button>' +
    (isRest?'<button class="tab-btn" id="tab-rest" onclick="switchTab(\'rest\')">🍽 Restaurante</button>':'')+
    '<button class="tab-btn" id="tab-media" onclick="switchTab(\'media\')">📷 Fotos/Vídeo</button></div>' +

    // INFO TAB
    '<div id="tab-info-content">' +
    '<div class="field-row"><div class="field"><label>Nombre</label><input class="inp" id="se-name" value="'+esc(s.name||'')+'"></div>' +
    '<div class="field"><label>Subtítulo</label><input class="inp" id="se-sub" value="'+esc(s.subtitle||'')+'"></div></div>' +
    '<div class="field-row-3">' +
      '<div class="field"><label>Tipo</label><select class="inp" id="se-type">'+TYPES.map(function(t){return'<option value="'+t.id+'"'+(s.type===t.id?' selected':'')+'>'+t.icon+' '+t.label+'</option>';}).join('')+'</select></div>' +
      '<div class="field"><label>Hora</label><input class="inp" id="se-time" value="'+esc(s.time||'')+'"></div>' +
      '<div class="field"><label>Duración</label><input class="inp" id="se-dur" value="'+esc(s.duration||'')+'"></div></div>' +
    '<div class="field"><label>Dirección</label><input class="inp" id="se-addr" value="'+esc(s.address||'')+'" placeholder="Calle, número, ciudad"></div>' +
    '<div class="field-row"><div class="field"><label>Latitud</label><input class="inp" id="se-lat" value="'+(s.lat||'')+'" placeholder="37.8789"></div>' +
    '<div class="field"><label>Longitud</label><input class="inp" id="se-lng" value="'+(s.lng||'')+'" placeholder="-4.7794"></div></div>' +
    '<div class="field"><label>Descripción</label><textarea class="inp" id="se-desc">'+esc(s.description||'')+'</textarea></div>' +
    '<div class="field"><label>Historia / Contexto</label><textarea class="inp" id="se-hist">'+esc(s.history||'')+'</textarea></div>' +
    '<div class="field"><label>Consejos (uno por línea)</label><textarea class="inp" id="se-tips">'+esc((s.tips||[]).join('\n'))+'</textarea></div>' +
    '<div class="field"><label>Datos clave</label>' +
    [0,1,2].map(function(fi){var f=(s.facts||[])[fi]||{value:'',label:''};return'<div style="display:flex;gap:0.4rem;margin-bottom:0.4rem;"><input class="inp" id="fv'+fi+'" value="'+esc(f.value)+'" placeholder="Valor" style="width:35%;"><input class="inp" id="fl'+fi+'" value="'+esc(f.label)+'" placeholder="Etiqueta" style="flex:1;"></div>';}).join('') +
    '</div>' +
    '<div class="field"><label>🌐 Sitio web</label><input class="inp" id="se-web" value="'+esc(s.website||'')+'" placeholder="https://..."></div>' +
    '</div>' + // end info tab

    // AUDIO TAB
    '<div id="tab-audio-content" style="display:none;">' +
    '<div style="margin-bottom:0.8rem;display:flex;gap:0.6rem;flex-wrap:wrap;align-items:center;">' +
      '<div style="font-size:0.72rem;color:var(--parch);opacity:0.6;font-style:italic;flex:1;">Divide la audioguía en secciones para una experiencia más inmersiva. Cada sección puede tener un mapa o imagen del interior.</div>' +
      '<button class="btn btn-sm" onclick="addSection()">+ Añadir sección</button>' +
    '</div>' +
    '<div id="sections-container">'+sectionsHtml+'</div>' +
    '</div>' + // end audio tab

    // RESTAURANT TAB
    (isRest?
    '<div id="tab-rest-content" style="display:none;">' +
    '<div class="field-row"><div class="field"><label>Teléfono</label><input class="inp" id="se-phone" value="'+esc(s.phone||'')+'" placeholder="+34 ..."></div>' +
    '<div class="field"><label>Precio (€ / €€ / €€€)</label><input class="inp" id="se-price" value="'+esc(s.priceRange||'')+'" placeholder="€€"></div></div>' +
    '<div class="field"><label>🗓 URL de reservas</label><input class="inp" id="se-book" value="'+esc(s.bookingUrl||'')+'" placeholder="https://thefork.es/..."></div>' +
    '<div class="field"><label>Platos recomendados</label><div id="dishes-container">'+dishesHtml+'</div>' +
    '<button class="btn btn-sm" onclick="addDish()" style="margin-top:0.4rem;">+ Añadir plato</button></div>' +
    '</div>' : '') +

    // MEDIA TAB
    '<div id="tab-media-content" style="display:none;">' +
    '<div class="field"><label>📹 URL vídeo YouTube</label><input class="inp" id="se-video" value="'+esc(s.videoUrl||'')+'" placeholder="https://www.youtube.com/watch?v=..."></div>' +
    '<div class="field"><label>Fotos</label>' +
    '<div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.7rem;">'+photosHtml+
    '<label onclick="doUpload()" style="width:90px;height:68px;border:1px dashed rgba(201,168,76,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;gap:0.2rem;color:rgba(201,168,76,0.5);font-size:0.72rem;">📷<span>Subir</span></label></div>' +
    '<button class="btn btn-sm" onclick="searchWiki()">🔍 Buscar en Wikimedia</button>' +
    '<div id="wiki-grid" style="margin-top:0.7rem;"></div></div>' +
    '</div>' + // end media tab

    '<div style="display:flex;gap:0.7rem;flex-wrap:wrap;margin-top:1rem;">' +
    '<button class="btn btn-gold" onclick="saveStop()" title="Guarda los cambios en memoria. Después pulsa '💾 Guardar' en la barra superior para escribir en GitHub.">✓ Aplicar cambios</button>' +
    '<div style="font-size:0.68rem;color:var(--parch);opacity:0.5;font-style:italic;margin-top:0.4rem;">Aplica los cambios y luego pulsa 💾 Guardar en la barra superior para guardar definitivamente en GitHub.</div>' +
    '<button class="btn btn-danger btn-sm" onclick="delStop('+idx+')">🗑 Eliminar</button>' +
    '</div></div>';

  document.getElementById('stop-editor').scrollIntoView({behavior:'smooth',block:'start'});
}

function switchTab(tab){
  ['info','audio','rest','media'].forEach(function(t){
    var btn=document.getElementById('tab-'+t);
    var content=document.getElementById('tab-'+t+'-content');
    if(btn)btn.classList.toggle('active',t===tab);
    if(content)content.style.display=t===tab?'block':'none';
  });
}

function closeEditor(){editIdx=null;document.getElementById('stop-editor').innerHTML='';}

function saveStop(){
  if(editIdx===null)return;
  var s=activeDay.stops[editIdx];
  _readStopFields(s);
  markDirty();
  document.getElementById('stops-list').innerHTML=renderStops();
  initDrag();
  toast('✓ Cambios aplicados','ok');
}

function v(id){var el=document.getElementById(id);return el?el.value:'';}

// Read all currently-visible stop editor fields into stop object (without re-rendering)
function _readStopFields(s){
  if(editIdx===null||!s)return;
  if(v('se-name'))s.name=v('se-name');
  if(v('se-sub')!==undefined)s.subtitle=v('se-sub');
  if(v('se-type'))s.type=v('se-type');
  if(v('se-time')!==undefined)s.time=v('se-time');
  if(v('se-dur')!==undefined)s.duration=v('se-dur');
  if(v('se-addr')!==undefined)s.address=v('se-addr');
  if(v('se-desc')!==undefined)s.description=v('se-desc');
  if(v('se-hist')!==undefined)s.history=v('se-hist');
  if(v('se-tips')!==undefined)s.tips=(v('se-tips')||'').split('\n').map(function(t){return t.trim();}).filter(Boolean);
  if(v('se-web')!==undefined)s.website=v('se-web');
  // Video — always read even if tab is hidden (input still in DOM)
  var vidEl=document.getElementById('se-video');
  if(vidEl)s.videoUrl=vidEl.value||'';
  var lat=parseFloat(v('se-lat'));var lng=parseFloat(v('se-lng'));
  if(!isNaN(lat))s.lat=lat;if(!isNaN(lng))s.lng=lng;
  s.color=(TYPES.find(function(t){return t.id===s.type;})||{color:s.color}).color||s.color;
  s.facts=[0,1,2].map(function(fi){var vv=v('fv'+fi),ll=v('fl'+fi);return(vv||ll)?{value:vv,label:ll}:null;}).filter(Boolean);
  // Audio sections
  s.audioSections=(s.audioSections||[]).map(function(sec,si){
    var tt=v('sec-t-'+si);var tx=v('sec-x-'+si);var tm=v('sec-m-'+si);
    return {id:sec.id,title:tt!==''?tt:sec.title,text:tx!==''?tx:sec.text,mapImage:tm!==''?tm:(sec.mapImage||'')};
  });
  // Restaurant
  if(s.type==='restaurant'){
    var ph=document.getElementById('se-phone');if(ph)s.phone=ph.value||'';
    var pr=document.getElementById('se-price');if(pr)s.priceRange=pr.value||'';
    var bk=document.getElementById('se-book');if(bk)s.bookingUrl=bk.value||'';
    s.dishes=(s.dishes||[]).map(function(d,di){
      var dn=v('dn-'+di);var dd=v('dd-'+di);
      return{name:dn!==''?dn:d.name,description:dd!==''?dd:d.description};
    });
  }
}

function delStop(idx){if(!confirm('¿Eliminar parada?'))return;activeDay.stops.splice(idx,1);markDirty();closeEditor();document.getElementById('stops-list').innerHTML=renderStops();initDrag();}

// Audio sections
function addSection(){
  if(editIdx===null)return;
  var s=activeDay.stops[editIdx];
  if(!s.audioSections)s.audioSections=[];
  s.audioSections.push({id:'as-'+Date.now(),title:'Sección '+(s.audioSections.length+1),text:'',mapImage:''});
  editStop(editIdx); switchTab('audio');
}
function delSection(si){if(editIdx===null)return;activeDay.stops[editIdx].audioSections.splice(si,1);editStop(editIdx);switchTab('audio');}

// Dishes
function addDish(){if(editIdx===null)return;var s=activeDay.stops[editIdx];if(!s.dishes)s.dishes=[];s.dishes.push({name:'',description:''});editStop(editIdx);switchTab('rest');}
function delDish(di){if(editIdx===null)return;activeDay.stops[editIdx].dishes.splice(di,1);editStop(editIdx);switchTab('rest');}

// Photos
function removePhoto(pi){
  if(editIdx===null)return;
  var s=activeDay.stops[editIdx];
  _readStopFields(s);  // preserve all current field values
  s.photos.splice(pi,1);
  markDirty();editStop(editIdx);switchTab('media');
}

function doUpload(){
  document.getElementById('fup').onchange=function(e){
    var file=e.target.files[0];if(!file||editIdx===null)return;
    var r=new FileReader();
    r.onload=function(ev){
      var parts=ev.target.result.split(',');
      var mime=parts[0].replace('data:','').replace(';base64','');
      var b64=parts[1];
      var key='s-'+Date.now();
      toast('Subiendo foto…','ok');
      fetch('/.netlify/functions/upload',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':ADMIN_TOKEN},
        body:JSON.stringify({key,data:b64,mime})})
        .then(function(r){return r.json();}).then(function(d){
          if(d.error){toast('Error: '+d.error,'err');return;}
          activeDay.stops[editIdx].photos.push('/.netlify/functions/photo?key='+key);
          markDirty();editStop(editIdx);switchTab('media');toast('✓ Foto subida','ok');
        }).catch(function(e){toast('Error: '+e.message,'err');});
    };r.readAsDataURL(file);
  };
  document.getElementById('fup').click();
}

async function searchWiki(){
  if(editIdx===null)return;
  var s=activeDay.stops[editIdx];
  var q=s.name+' '+(s.location||(tour.meta&&tour.meta.title)||'');
  var g=document.getElementById('wiki-grid');
  g.innerHTML='<div style="font-style:italic;opacity:0.5;font-size:0.83rem;">Buscando…</div>';
  try{
    var r=await fetch('/.netlify/functions/wikimedia?query='+encodeURIComponent(q));
    var d=await r.json();
    if(!d.ok||!d.photos||!d.photos.length){g.innerHTML='<div style="opacity:0.5;font-size:0.83rem;">Sin resultados</div>';return;}
    wikiPhotos=d.photos;
    renderWikiGrid(s.photos||[]);
  }catch(e){g.innerHTML='<div style="color:var(--err);font-size:0.83rem;">Error: '+e.message+'</div>';}
}

function renderWikiGrid(cur){
  var g=document.getElementById('wiki-grid');if(!g)return;
  g.innerHTML='<div style="font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);opacity:0.55;margin-bottom:0.5rem;">Pulsa para añadir/quitar</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:0.4rem;">'+
    wikiPhotos.map(function(p,i){
      var sel=cur.indexOf(p.url)>=0;
      return '<div onclick="toggleWiki('+i+')" style="position:relative;aspect-ratio:4/3;overflow:hidden;cursor:pointer;border:2px solid '+(sel?'var(--gold)':'transparent')+';transition:all .2s;">' +
        '<img src="'+p.url+'" style="width:100%;height:100%;object-fit:cover;" loading="lazy">' +
        (sel?'<div style="position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:0.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;">✓</div>':'')+'</div>';
    }).join('')+'</div>';
}

function toggleWiki(wi){
  if(editIdx===null)return;
  var s=activeDay.stops[editIdx];if(!s.photos)s.photos=[];
  var url=wikiPhotos[wi].url;
  var pos=s.photos.indexOf(url);
  if(pos>=0)s.photos.splice(pos,1);else s.photos.push(url);
  markDirty();renderWikiGrid(s.photos);
  // Also read all current DOM fields so nothing is lost
  _readStopFields(s);
}

// ── DRAG & DROP ───────────────────────────────────────────────────────────────
function initDrag(){
  document.querySelectorAll('.stop-row').forEach(function(row){
    row.addEventListener('dragstart',function(e){dragSrc=parseInt(this.dataset.idx);e.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragend',function(){document.querySelectorAll('.stop-row').forEach(function(r){r.classList.remove('dragover');});});
    row.addEventListener('dragover',function(e){e.preventDefault();this.classList.add('dragover');});
    row.addEventListener('dragleave',function(){this.classList.remove('dragover');});
    row.addEventListener('drop',function(e){
      e.preventDefault();this.classList.remove('dragover');
      var di=parseInt(this.dataset.idx);
      if(dragSrc===null||dragSrc===di)return;
      var m=activeDay.stops.splice(dragSrc,1)[0];
      activeDay.stops.splice(di,0,m);
      markDirty();document.getElementById('stops-list').innerHTML=renderStops();initDrag();
    });
  });
}

// ── SAVE ─────────────────────────────────────────────────────────────────────
async function saveTour(){
  // Auto-apply any open stop editor before saving
  if(editIdx!==null) saveStop();
  // Auto-apply meta fields if visible
  if(document.getElementById('m-title')) updateMeta();

  var btn=document.getElementById('save-btn');
  btn.disabled=true;btn.textContent='⏳ Guardando…';
  try{
    tour.meta.updatedAt=new Date().toISOString();
    var r=await fetch('/.netlify/functions/save',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':ADMIN_TOKEN},body:JSON.stringify({tourData:tour})});
    var d=await r.json();
    if(d.error)throw new Error(d.error);
    dirty=false;btn.textContent='✓ Guardado';btn.disabled=false;
    setTimeout(function(){btn.textContent='💾 Guardar';btn.disabled=true;},2000);
    toast('✓ Guardado en GitHub','ok');
  }catch(e){btn.textContent='💾 Guardar';btn.disabled=false;toast('Error: '+e.message,'err');}
}

function markDirty(){dirty=true;document.getElementById('save-btn').disabled=false;}

var tt;
function toast(msg,type){var el=document.getElementById('toast');el.textContent=msg;el.className='show '+(type||'ok');clearTimeout(tt);tt=setTimeout(function(){el.className='';},3200);}
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});
</script>
